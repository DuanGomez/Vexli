# Render Blueprint: crea la API de Vexli (Python, plan gratis).
# Al crearla, Render pide DATABASE_URL: pega la cadena de conexión de Neon (PostgreSQL).
services:
  - type: web
    name: vexli-api
    runtime: python
    plan: free
    region: virginia
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /up
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vexli-caja.pages.dev,http://localhost:5320
